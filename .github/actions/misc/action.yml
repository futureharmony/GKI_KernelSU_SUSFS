name: 'Setup Misc Configs'
description: 'Set up kernel configuration fragment with miscellaneous options'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.12)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  sublevel:
    description: 'Sublevel of kernel version (e.g., 1)'
    required: true
  variant:
    description: 'Build variant (Normal, Bypass, Wild, boot-time)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          # Container CPU limits (cpu.max / cgroup v2 CPU bandwidth).
          # Zero ABI drift: include/ has 0 references, FAIR_GROUP_SCHED is already =y
          # (struct sched_entity unchanged) - verified by upstream on 5.10/5.15/6.1/6.12.
          # Only 6.18 grows task_struct, and there stock already sets CFS_BANDWIDTH=y.
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_FANOTIFY=y
          CONFIG_FANOTIFY_ACCESS_PERMISSIONS=y
          